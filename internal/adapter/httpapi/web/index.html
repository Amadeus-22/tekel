<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tekel · live market data status</title>
<meta name="description" content="Live health of market data feeds and chain blocks: connected, fresh and complete, or not.">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/app.js" defer></script>
</head>
<body>
<header class="top">
  <div class="brand">
    <img class="mark" src="/assets/logo.png" alt="" width="40" height="40">
    <div>
      <div class="name">Tekel</div>
      <div class="tag">Live market data status</div>
    </div>
  </div>
  <a class="gh" href="https://github.com/Amadeus-22/tekel" rel="noopener">Open source on GitHub</a>
</header>

<main>
  <section id="banner" class="banner loading" aria-live="polite">
    <span class="dot" aria-hidden="true"></span>
    <div>
      <div id="banner-title" class="banner-title">Checking feeds…</div>
      <div id="banner-sub" class="banner-sub"></div>
    </div>
  </section>

  <section>
    <h2>Sources</h2>
    <div id="sources" class="grid"></div>
  </section>

  <section>
    <div class="row">
      <h2>Incidents, last 24 hours</h2>
      <span id="inc-count" class="muted"></span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>When (UTC)</th><th>Source</th><th>Kind</th><th>Detail</th></tr></thead>
        <tbody id="incidents"><tr><td colspan="4" class="muted">Loading…</td></tr></tbody>
      </table>
    </div>
    <button id="more" class="more" type="button" hidden>Show all</button>
  </section>
</main>

<footer>
  <span id="updated" class="muted">—</span>
  <span class="muted">Data from public exchange and node endpoints, checked by <a href="https://github.com/Amadeus-22/tekel" rel="noopener">Tekel</a>.</span>
</footer>
</body>
</html>
