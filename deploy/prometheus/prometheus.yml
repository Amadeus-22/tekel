# Scrapes Tekel for the optional observability profile:
#   docker compose -f deploy/docker-compose.yml --profile observability up
global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Trust Score per exchange (tested with: promtool test rules rules_test.yml).
rule_files:
  - rules.yml

scrape_configs:
  - job_name: tekel
    static_configs:
      - targets: ["tekel:8080"]
