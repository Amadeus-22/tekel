# Tekel alone:                docker compose -f deploy/docker-compose.yml up --build
# With Prometheus + Grafana:  docker compose -f deploy/docker-compose.yml --profile observability up --build
#   Grafana http://localhost:3000 (anonymous viewer), Prometheus http://localhost:9090.
# Every port is published on 127.0.0.1 only.
services:
  tekel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tekel:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TEKEL_LOG_LEVEL: ${TEKEL_LOG_LEVEL:-info}
      TEKEL_BINANCE_SYMBOLS: ${TEKEL_BINANCE_SYMBOLS:-BTCUSDT,ETHUSDT}
      TEKEL_KRAKEN_SYMBOLS: ${TEKEL_KRAKEN_SYMBOLS:-BTC/USD,ETH/USD}
      TEKEL_COINBASE_SYMBOLS: ${TEKEL_COINBASE_SYMBOLS:-BTC-USD,ETH-USD}
      # Off unless set in the shell, e.g. TEKEL_MERCADOBITCOIN_SYMBOLS=BTC-BRL
      # (LEAN needs a custom market, ADR 0006) or TEKEL_KLEVER_NETWORK=testnet.
      TEKEL_MERCADOBITCOIN_SYMBOLS: ${TEKEL_MERCADOBITCOIN_SYMBOLS:-}
      TEKEL_KLEVER_NETWORK: ${TEKEL_KLEVER_NETWORK:-}
      TEKEL_STALE_AFTER_OVERRIDES: ${TEKEL_STALE_AFTER_OVERRIDES:-}
      # Alerts, off unless set in the shell (see README "Alerts").
      TEKEL_TELEGRAM_BOT_TOKEN: ${TEKEL_TELEGRAM_BOT_TOKEN:-}
      TEKEL_TELEGRAM_CHAT_ID: ${TEKEL_TELEGRAM_CHAT_ID:-}
      TEKEL_WEBHOOK_URL: ${TEKEL_WEBHOOK_URL:-}
      # Reference prices, off unless set (docs/coinmarketcap.md).
      TEKEL_CMC_API_KEY: ${TEKEL_CMC_API_KEY:-}
      TEKEL_REFERENCE_INTERVAL: ${TEKEL_REFERENCE_INTERVAL:-60s}
      TEKEL_REFERENCE_THRESHOLD: ${TEKEL_REFERENCE_THRESHOLD:-0.01}
    volumes:
      # LEAN bars under /var/lib/tekel/data, incidents in tekel.db
      - tekel-data:/var/lib/tekel
    stop_grace_period: 15s

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-0}
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    depends_on: [tekel]

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tekel.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Tekel sends its own alerts; Grafana alerting would only add an empty page.
      GF_UNIFIED_ALERTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      # Tekel logo as the browser tab icon and the Grafana menu logo.
      - ./grafana/branding/fav32.png:/usr/share/grafana/public/img/fav32.png:ro
      - ./grafana/branding/apple-touch-icon.png:/usr/share/grafana/public/img/apple-touch-icon.png:ro
      - ./grafana/branding/grafana_icon.svg:/usr/share/grafana/public/img/grafana_icon.svg:ro
      # The menu logo is a hashed build file; the hash changes with the Grafana image tag.
      - ./grafana/branding/grafana_icon.svg:/usr/share/grafana/public/build/static/img/grafana_icon.1e0deb6b.svg:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  tekel-data:
  prometheus-data:
  grafana-data:
