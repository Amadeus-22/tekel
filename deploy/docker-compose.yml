# Local run: docker compose -f deploy/docker-compose.yml up --build
services:
  tekel:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tekel:dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TEKEL_LOG_LEVEL: info
      TEKEL_BINANCE_SYMBOLS: BTCUSDT,ETHUSDT
      TEKEL_KRAKEN_SYMBOLS: BTC/USD,ETH/USD
      TEKEL_MERCADOBITCOIN_SYMBOLS: ""   # e.g. BTC-BRL; LEAN needs a custom market (ADR 0006)
    volumes:
      # LEAN bars under /var/lib/tekel/data, incidents in tekel.db
      - tekel-data:/var/lib/tekel
    stop_grace_period: 15s

volumes:
  tekel-data:
