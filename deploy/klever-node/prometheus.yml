# Scrape config for a KleverChain node (klever-go).
# /node/metrics is in Prometheus text format. /validator/statistics is JSON,
# so Prometheus cannot scrape it; this setup does not use it.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: klever-node
    metrics_path: /node/metrics
    static_configs:
      # Your node's REST API (default port 8080). One target per node.
      - targets: ["127.0.0.1:8080"]
        labels:
          node: my-validator
